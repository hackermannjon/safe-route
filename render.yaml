# Render Blueprint for the Django API (free web service).
# The front end is deployed separately (Vercel); see README.md, "Deploy".
services:
  - type: web
    name: safe-route-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One process so every request shares the in-memory cache; threads cover concurrent
    # requests, which spend most of their time waiting on the routing and weather services.
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # The front end's origin, e.g. https://safe-route.vercel.app (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
