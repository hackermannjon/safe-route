<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Safe Route · Screen sizes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #071a21;
        --surface: #0c2530;
        --border: #21485a;
        --ink: #ecf3f5;
        --accent: #5b8cff;
        --accent-ink: #0a0f1a;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 Barlow, system-ui, sans-serif;
      }
      .bar {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        gap: 6px;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 4px 16px #0006;
      }
      .bar button {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .bar button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .stage {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      iframe {
        border: 0;
        display: block;
        background: var(--bg);
      }
      .desktop iframe {
        width: 100%;
        height: 100%;
      }
      .tablet iframe,
      .mobile iframe {
        height: min(var(--h), calc(100% - 32px));
        max-width: calc(100% - 32px);
        border-radius: 24px;
        box-shadow: 0 0 0 10px #000, 0 0 0 11px var(--border), 0 20px 60px #0008;
      }
      .tablet iframe {
        width: 768px;
        --h: 1024px;
      }
      .mobile iframe {
        width: 390px;
        --h: 844px;
      }
    </style>
  </head>
  <body class="desktop">
    <div class="bar" role="toolbar" aria-label="Screen size">
      <button type="button" data-size="desktop" aria-pressed="true" title="Shortcut: D">Desktop</button>
      <button type="button" data-size="tablet" aria-pressed="false" title="Shortcut: T (768 × 1024)">Tablet</button>
      <button type="button" data-size="mobile" aria-pressed="false" title="Shortcut: M (390 × 844)">Mobile</button>
    </div>
    <div class="stage"><iframe src="/" title="Safe Route"></iframe></div>
    <script>
      // The app picks its layout from its own width, so resizing the frame is enough to switch it.
      const sizes = ['desktop', 'tablet', 'mobile'];
      function show(size) {
        document.body.classList.remove(...sizes);
        document.body.classList.add(size);
        document.querySelectorAll('[data-size]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.size === size));
        });
        try {
          localStorage.setItem('screen-size', size);
        } catch {}
      }
      document.querySelectorAll('[data-size]').forEach((button) => {
        button.addEventListener('click', () => show(button.dataset.size));
      });
      // Keys typed inside the app stay in the frame, so the shortcuts never fire while filling the form.
      addEventListener('keydown', (event) => {
        const size = { d: 'desktop', t: 'tablet', m: 'mobile' }[event.key.toLowerCase()];
        if (size) show(size);
      });
      let saved = null;
      try {
        saved = localStorage.getItem('screen-size');
      } catch {}
      show(sizes.includes(saved) ? saved : 'desktop');
    </script>
  </body>
</html>
